name: Update data, news and site

on:
  schedule:
    - cron: "17 3 * * 0"     # weekly: check every data source for new releases
    - cron: "41 */3 * * *"   # every 3 hours: refresh news and redeploy
  workflow_dispatch:
    inputs:
      sources:
        description: "Data sources to check (comma-separated: unsdg,wdi,owid). Empty = news only."
        default: "unsdg,wdi,owid"
        required: false
      quick:
        description: "Quick test run: only a few series per source"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", "config/**", ".github/workflows/update.yml"]

permissions:
  contents: write   # publish the data bundle as a release asset
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt

      - name: Test pipeline
        run: cd pipeline && pytest -q

      - name: Download previous build
        run: |
          mkdir -p prev
          if gh release download data-latest -p gse-data.tar.gz -D prev; then
            tar -xzf prev/gse-data.tar.gz -C prev && rm prev/gse-data.tar.gz
            echo "Previous build found: $(cat prev/data/meta.json | head -c 300)"
          else
            echo "No previous build; doing a full first build."
          fi

      - name: Decide what to check
        id: plan
        run: |
          SOURCES=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SOURCES="${{ inputs.sources }}"
          elif [ "${{ github.event.schedule }}" = "17 3 * * 0" ]; then
            SOURCES="unsdg,wdi,owid"
          fi
          # No previous data at all: everything must be built.
          if [ ! -f prev/data/observations.parquet ]; then SOURCES="unsdg,wdi,owid"; fi
          echo "sources=$SOURCES" >> "$GITHUB_OUTPUT"
          echo "Checking sources: '${SOURCES:-none (news and site only)}'"

      - name: Quick-run limits
        # A manual quick test, or the very first push (so the site goes live fast);
        # the next full run fills in everything else.
        if: ${{ inputs.quick || (github.event_name == 'push' && hashFiles('prev/data/observations.parquet') == '') }}
        run: |
          echo "GSE_UNSDG_SERIES=EG_FEC_RNEW,EG_ACS_ELEC,EG_EGY_CLEAN,EN_ATM_CO2,AG_LND_FRST,SG_GEN_PARL,SH_H2O_SAFE,SI_POV_DAY1,EN_MAR_PLASDD,SP_ACS_BSRVH2O" >> "$GITHUB_ENV"
          echo "GSE_WDI_INDICATORS=EG.ELC.ACCS.ZS,EG.FEC.RNEW.ZS,EN.GHG.ALL.PC.CE.AR5,AG.LND.FRST.ZS,SI.POV.DDAY,EG.USE.PCAP.KG.OE" >> "$GITHUB_ENV"

      - name: Build data
        id: build
        run: |
          cd pipeline
          python -m gse.build --prev ../prev --out ../build --sources "${{ steps.plan.outputs.sources }}" | tee ../build.log
          CHANGED=$(tail -n 1 ../build.log | python -c "import sys,json; print(str(json.loads(sys.stdin.read())['changed']).lower())")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Refresh news
        run: |
          cd pipeline
          python -m gse.news --out ../build/site-data --prev ../prev/data/news.json --geo ../build/site-data/geo.json
          cp ../build/site-data/news.json ../build/data/news.json

      - name: Publish data bundle (release "data-latest")
        run: |
          tar -czf gse-data.tar.gz -C build data
          ls -lh gse-data.tar.gz
          if ! gh release view data-latest >/dev/null 2>&1; then
            gh release create data-latest --title "Latest data" --notes "Rolling release: the newest validated data bundle (Parquet + metadata), replaced on every update. Dated releases keep earlier versions." --latest=false
          fi
          gh release upload data-latest gse-data.tar.gz --clobber

      - name: Archive a dated copy when data changed
        if: steps.build.outputs.changed == 'true' && steps.plan.outputs.sources != ''
        run: |
          TAG="data-$(date -u +%Y-%m-%d-%H%M)"
          gh release create "$TAG" gse-data.tar.gz --title "Data $(date -u +%Y-%m-%d)" \
            --notes "Snapshot of the data after this update, kept so earlier answers can be reproduced. See What's new on the site for the change summary." --latest=false

      - name: Assemble site
        run: |
          cp -r site _site
          cp -r build/site-data _site/data
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
