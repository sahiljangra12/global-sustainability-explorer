# Seed evaluation set for the chat assistant. Each case names the indicator the
# answer should use and places it must mention. Run: python api/eval/run_eval.py
# Grow this to ~100 questions as real users ask things.
cases:
  - q: What share of India's final energy consumption is renewable?
    indicator: unsdg:EG_FEC_RNEW
    places: [IND]
  - q: Renewable energy share in Brazil vs Germany since 2010
    indicator: unsdg:EG_FEC_RNEW
    places: [BRA, DEU]
  - q: CO2 emissions per capita in the United States since 1990
    indicator: owid:co2_per_capita
    places: [USA]
  - q: Which countries emit the most CO2 in total?
    indicator: owid:co2
  - q: Top 10 countries by access to electricity
    indicator_any: [unsdg:EG_ACS_ELEC, wdi:EG.ELC.ACCS.ZS]
  - q: How has access to electricity changed in Nigeria since 2000?
    indicator_any: [unsdg:EG_ACS_ELEC, wdi:EG.ELC.ACCS.ZS]
    places: [NGA]
  - q: Proportion of seats held by women in national parliaments in Rwanda
    indicator: unsdg:SG_GEN_PARL
    places: [RWA]
  - q: Forest area as a share of land area in Indonesia
    indicator_any: [unsdg:AG_LND_FRST, wdi:AG.LND.FRST.ZS]
    places: [IDN]
  - q: Share of electricity from solar in Australia
    indicator: owid:solar_share_elec
    places: [AUS]
  - q: Population with clean cooking fuels in Kenya
    indicator_any: [unsdg:EG_EGY_CLEAN]
    places: [KEN]
  - q: Annual greenhouse gas emissions of China
    indicator_any: [owid:total_ghg, wdi:EN.GHG.ALL.MT.CE.AR5]
    places: [CHN]
  - q: Is there data on coral reef bleaching?
    expect_no_data: true
